# Components maintained by this repository.

[[component]]
name = "rust-toolchain"
destination = "prebuilts/rust-toolchain/linux-arm64"
source = "https://android.googlesource.com/toolchain/android_rust"
method = "build"
host = "aarch64-unknown-linux-gnu"
notes = "Build with Google's Android Rust toolchain pipeline using native ARM64 stage0 Rust and AOSP ARM64 Clang."

[[component]]
name = "jdk21"
destination = "prebuilts/jdk/jdk21/linux-arm64"
source = "https://android.googlesource.com/toolchain/jdk/build"
method = "build"
host = "aarch64-linux-gnu"
major_version = 21
notes = "Native ARM64 adaptation of AOSP build-openjdk21-linux.sh using ARM64 Clang, boot JDK and Debian sysroot dependencies."
