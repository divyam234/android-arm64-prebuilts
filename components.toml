# Components maintained by this repository.
# Compatibility baseline: refs/tags/android-16.0.0_r4.
# Run scripts/update-revisions.sh to refresh exact source/ARM64 mirror SHAs.

[[component]]
name = "rust-toolchain"
destination = "prebuilts/rust-toolchain/linux-arm64"
source = "https://android.googlesource.com/toolchain/android_rust"
method = "build"
host = "aarch64-unknown-linux-gnu"
compatibility_tag = "refs/tags/android-16.0.0_r4"
notes = "Build with Google's Android Rust toolchain pipeline using native ARM64 stage0 Rust and AOSP ARM64 Clang."

[[component]]
name = "jdk8"
destination = "prebuilts/jdk/jdk8/linux-arm64"
source = "https://android.googlesource.com/platform/prebuilts/jdk/jdk8"
method = "import-native-jdk"
host = "aarch64-linux"
major_version = 8
compatibility_tag = "refs/tags/android-16.0.0_r4"
notes = "Import a native AArch64 JDK8 and validate it against the Android 16 JDK8 prebuilt revision recorded in revisions.lock."

[[component]]
name = "jdk21"
destination = "prebuilts/jdk/jdk21/linux-arm64"
source = "https://android.googlesource.com/toolchain/jdk/build"
method = "build"
host = "aarch64-linux-gnu"
major_version = 21
compatibility_tag = "refs/tags/android-16.0.0_r4"
notes = "Native ARM64 adaptation of AOSP build-openjdk21-linux.sh using the Android 16 compatibility baseline and exact revisions from revisions.lock."
